name: Update MySQL Version

on:
  schedule:
    - cron: '0 2 1 * *'  # 1st of each month, 02:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.4", "9.7"]

    steps:
      - uses: actions/checkout@v5

      - name: Fetch latest version from APT repository
        id: latest
        run: |
          suite=$(jq -r --arg v "${{ matrix.mysql }}" '.[$v].debian.suite' versions.json)
          # LTS repo component naming convention: mysql-<major>-lts (holds only for LTS lines, which is all this project tracks)
          component="mysql-${{ matrix.mysql }}-lts"
          version=$(curl -fsSL \
            "http://repo.mysql.com/apt/debian/dists/${suite}/${component}/binary-amd64/Packages" \
            | awk '/^Package: mysql-community-server-core/{found=1} found && /^Version:/{print $2; exit}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "component=$component" >> "$GITHUB_OUTPUT"

      - name: Get current version from Dockerfile
        id: current
        run: |
          version=$(grep '^ENV MYSQL_VERSION=' ${{ matrix.mysql }}/Dockerfile.debian | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update files if version changed
        if: steps.latest.outputs.version != steps.current.outputs.version
        env:
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          mysql_version=$(echo "$LATEST" | cut -d- -f1)

          sed -i "s/^ENV MYSQL_VERSION=.*/ENV MYSQL_VERSION=${LATEST}/" ${{ matrix.mysql }}/Dockerfile.debian

          jq --arg k "${{ matrix.mysql }}" --arg v "$mysql_version" --arg dv "$LATEST" \
            '.[$k].version = $v | .[$k].debian.version = $dv' \
            versions.json > versions.json.tmp && mv versions.json.tmp versions.json

      - name: Open PR
        if: steps.latest.outputs.version != steps.current.outputs.version
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update MySQL ${{ matrix.mysql }} to ${{ steps.latest.outputs.version }}"
          title: "chore: update MySQL ${{ matrix.mysql }} to ${{ steps.latest.outputs.version }}"
          body: |
            Automated version bump for MySQL ${{ matrix.mysql }} from `${{ steps.current.outputs.version }}` to `${{ steps.latest.outputs.version }}`.

            Source: http://repo.mysql.com/apt/debian/dists/${{ steps.latest.outputs.suite }}/${{ steps.latest.outputs.component }}/binary-amd64/Packages
          branch: update/mysql-${{ matrix.mysql }}-${{ steps.latest.outputs.version }}
          delete-branch: true
