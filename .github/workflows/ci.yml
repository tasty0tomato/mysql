name: Build and Test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

# Read-only by default. The push jobs declare their own block to add
# packages: write; a job-level block replaces this one entirely.
permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mysql: "8.4", latest: true }
          - { mysql: "9.7" }
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f ${{ matrix.mysql }}/Dockerfile ${{ matrix.mysql }}/ -t mysql-test:${{ matrix.mysql }}-trixie

      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh mysql-test:${{ matrix.mysql }}-trixie

  # Oracle Linux variant: the only one available for arm64, because MySQL's APT
  # repositories publish amd64 packages only. Each architecture is built and
  # smoke-tested natively on its own runner rather than under emulation.
  build-oracle:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f 8.4/Dockerfile.oracle 8.4/ -t mysql-test:8.4-oraclelinux9

      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh mysql-test:8.4-oraclelinux9

  push:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mysql: "8.4", latest: true }
          - { mysql: "9.7" }

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mysql
          tags: |
            type=raw,value=${{ matrix.mysql }}-trixie
            type=raw,value=${{ matrix.mysql }}
            type=raw,value=latest,enable=${{ matrix.latest == true }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.mysql }}
          file: ${{ matrix.mysql }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  push-oracle:
    needs: build-oracle
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # QEMU only has to run microdnf for the arm64 half; nothing is compiled.
      # Correctness on arm64 is covered by the native build-oracle job above.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mysql
          tags: |
            type=raw,value=8.4-oraclelinux9

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: "8.4"
          file: 8.4/Dockerfile.oracle
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
