name: Build and Test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.4", "9.7"]
    steps:
      - uses: actions/checkout@v5

      - name: Read suite from versions.json
        id: suite
        run: echo "suite=$(jq -r --arg v "${{ matrix.mysql }}" '.[$v].suite' versions.json)" >> "$GITHUB_OUTPUT"

      - name: Build Debian image
        run: docker build -f ${{ matrix.mysql }}/Dockerfile.debian --build-arg "DEBIAN_SUITE=${{ steps.suite.outputs.suite }}" ${{ matrix.mysql }}/ -t mysql-debian:${{ matrix.mysql }}-test

      - name: Smoke test
        run: |
          docker run -d --name test-mysql \
            -e MYSQL_ROOT_PASSWORD=test \
            mysql-debian:${{ matrix.mysql }}-test
          for i in $(seq 1 60); do
            if docker exec test-mysql mysql -uroot -ptest -e "SELECT VERSION()" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          docker stop test-mysql
          docker rm test-mysql

  push:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.4", "9.7"]

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read suite and latest flag from versions.json
        id: version
        run: |
          suite=$(jq -r --arg v "${{ matrix.mysql }}" '.[$v].suite' versions.json)
          is_latest=$(jq -r --arg v "${{ matrix.mysql }}" '.[$v].latest // false' versions.json)
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mysql
          tags: |
            type=raw,value=${{ matrix.mysql }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_latest }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.mysql }}
          file: ${{ matrix.mysql }}/Dockerfile.debian
          build-args: DEBIAN_SUITE=${{ steps.version.outputs.suite }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
