name: Build and Test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # "tag" is the image tag suffix, "suite" is the MySQL APT repo suite.
      # They coincide on Debian but not on Ubuntu (ubuntu26.04 vs resolute).
      matrix:
        include:
          - { mysql: "8.4", tag: trixie,      base: "debian:trixie-slim",   distro: debian, suite: trixie,   default: true, latest: true }
          - { mysql: "8.4", tag: bookworm,    base: "debian:bookworm-slim", distro: debian, suite: bookworm }
          - { mysql: "8.4", tag: ubuntu26.04, base: "ubuntu:26.04",         distro: ubuntu, suite: resolute }
          - { mysql: "9.7", tag: trixie,      base: "debian:trixie-slim",   distro: debian, suite: trixie,   default: true }
          - { mysql: "9.7", tag: bookworm,    base: "debian:bookworm-slim", distro: debian, suite: bookworm }
          - { mysql: "9.7", tag: ubuntu26.04, base: "ubuntu:26.04",         distro: ubuntu, suite: resolute }
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: |
          docker build -f ${{ matrix.mysql }}/Dockerfile \
            --build-arg "BASE_IMAGE=${{ matrix.base }}" \
            --build-arg "MYSQL_APT_DISTRO=${{ matrix.distro }}" \
            --build-arg "MYSQL_APT_SUITE=${{ matrix.suite }}" \
            ${{ matrix.mysql }}/ -t mysql-test:${{ matrix.mysql }}-${{ matrix.tag }}

      - name: Smoke test
        run: |
          docker run -d --name test-mysql \
            -e MYSQL_ROOT_PASSWORD=test \
            mysql-test:${{ matrix.mysql }}-${{ matrix.tag }}
          # Probe over TCP rather than the unix socket. While it initializes, the
          # entrypoint runs a temporary server started with --skip-networking, so
          # a socket probe reports ready against that server and the connection is
          # then pulled away when it is shut down. Only the real server has TCP.
          for i in $(seq 1 60); do
            if docker exec test-mysql mysql -h 127.0.0.1 -uroot -ptest -e "SELECT VERSION()" 2>/dev/null; then
              ready=yes
              break
            fi
            sleep 2
          done
          # Without this check the loop simply falls through when the server
          # never starts, and the step passes on a completely broken image.
          if [ "$ready" != yes ]; then
            echo "Server never became ready. Container log:"
            docker logs test-mysql
            exit 1
          fi
          # The entrypoint loads the time zone tables from /usr/share/zoneinfo.
          # An empty table means the image is missing tzdata.
          tz="$(docker exec test-mysql mysql -h 127.0.0.1 -uroot -ptest -N -e 'SELECT COUNT(*) FROM mysql.time_zone_name')"
          echo "time zone names loaded: $tz"
          [ "$tz" -gt 0 ]
          docker stop test-mysql
          docker rm test-mysql

  push:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mysql: "8.4", tag: trixie,      base: "debian:trixie-slim",   distro: debian, suite: trixie,   default: true, latest: true }
          - { mysql: "8.4", tag: bookworm,    base: "debian:bookworm-slim", distro: debian, suite: bookworm }
          - { mysql: "8.4", tag: ubuntu26.04, base: "ubuntu:26.04",         distro: ubuntu, suite: resolute }
          - { mysql: "9.7", tag: trixie,      base: "debian:trixie-slim",   distro: debian, suite: trixie,   default: true }
          - { mysql: "9.7", tag: bookworm,    base: "debian:bookworm-slim", distro: debian, suite: bookworm }
          - { mysql: "9.7", tag: ubuntu26.04, base: "ubuntu:26.04",         distro: ubuntu, suite: resolute }

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mysql
          tags: |
            type=raw,value=${{ matrix.mysql }}-${{ matrix.tag }}
            type=raw,value=${{ matrix.mysql }},enable=${{ matrix.default == true }}
            type=raw,value=latest,enable=${{ matrix.latest == true }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.mysql }}
          file: ${{ matrix.mysql }}/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            MYSQL_APT_DISTRO=${{ matrix.distro }}
            MYSQL_APT_SUITE=${{ matrix.suite }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
