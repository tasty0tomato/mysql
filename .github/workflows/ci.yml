name: Build and Test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mysql: "8.4", suite: trixie,   default: true, latest: true }
          - { mysql: "8.4", suite: bookworm }
          - { mysql: "9.7", suite: trixie,   default: true }
          - { mysql: "9.7", suite: bookworm }
    steps:
      - uses: actions/checkout@v5

      - name: Build Debian image
        run: docker build -f ${{ matrix.mysql }}/Dockerfile.debian --build-arg "DEBIAN_SUITE=${{ matrix.suite }}" ${{ matrix.mysql }}/ -t mysql-debian:${{ matrix.mysql }}-${{ matrix.suite }}-test

      - name: Smoke test
        run: |
          docker run -d --name test-mysql \
            -e MYSQL_ROOT_PASSWORD=test \
            mysql-debian:${{ matrix.mysql }}-${{ matrix.suite }}-test
          for i in $(seq 1 60); do
            if docker exec test-mysql mysql -uroot -ptest -e "SELECT VERSION()" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          docker stop test-mysql
          docker rm test-mysql

  push:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mysql: "8.4", suite: trixie,   default: true, latest: true }
          - { mysql: "8.4", suite: bookworm }
          - { mysql: "9.7", suite: trixie,   default: true }
          - { mysql: "9.7", suite: bookworm }

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mysql
          tags: |
            type=raw,value=${{ matrix.mysql }}-${{ matrix.suite }}
            type=raw,value=${{ matrix.mysql }},enable=${{ matrix.default == true }}
            type=raw,value=latest,enable=${{ matrix.latest == true }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.mysql }}
          file: ${{ matrix.mysql }}/Dockerfile.debian
          build-args: DEBIAN_SUITE=${{ matrix.suite }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
