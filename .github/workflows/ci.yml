name: Build and Test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

# Read-only by default. The jobs that push declare their own block to add
# packages: write; a job-level block replaces this one entirely.
permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mysql
  PUBLISH: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}

jobs:
  # One job per image and architecture, each on a native runner. The image is
  # smoke-tested first; the push step then rebuilds it from the builder's cache,
  # so what gets published is exactly what was tested. Images are pushed by
  # digest only, and the merge job below gives them their tags.
  build:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Oracle Linux is the only variant with arm64, because MySQL's APT
      # repository publishes amd64 packages only.
      matrix:
        include:
          - { mysql: "8.4", variant: trixie,       file: Dockerfile,        arch: amd64 }
          - { mysql: "9.7", variant: trixie,       file: Dockerfile,        arch: amd64 }
          - { mysql: "8.4", variant: oraclelinux9, file: Dockerfile.oracle, arch: amd64 }
          - { mysql: "8.4", variant: oraclelinux9, file: Dockerfile.oracle, arch: arm64 }
          - { mysql: "9.7", variant: oraclelinux9, file: Dockerfile.oracle, arch: amd64 }
          - { mysql: "9.7", variant: oraclelinux9, file: Dockerfile.oracle, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.mysql }}
          file: ${{ matrix.mysql }}/${{ matrix.file }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: mysql-test:${{ matrix.mysql }}-${{ matrix.variant }}

      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh mysql-test:${{ matrix.mysql }}-${{ matrix.variant }}

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.mysql }}
          file: ${{ matrix.mysql }}/${{ matrix.file }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.mysql }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Tags each image once all of its architectures have been pushed. It runs
  # even when other build entries failed, so a broken variant only holds back
  # its own tags; a missing architecture fails the entry instead of publishing
  # an incomplete image.
  merge:
    needs: build
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mysql: "8.4", variant: trixie,       archs: 1, latest: true }
          - { mysql: "9.7", variant: trixie,       archs: 1 }
          - { mysql: "8.4", variant: oraclelinux9, archs: 2 }
          - { mysql: "9.7", variant: oraclelinux9, archs: 2 }
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.mysql }}-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Check every architecture was pushed
        env:
          ARCHS: ${{ matrix.archs }}
        run: |
          count="$(find "$RUNNER_TEMP/digests" -type f 2>/dev/null | wc -l)"
          if [ "$count" -ne "$ARCHS" ]; then
            echo "expected $ARCHS digest(s), found $count"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ matrix.mysql }}-${{ matrix.variant }}
            type=raw,value=${{ matrix.mysql }},enable=${{ matrix.variant == 'trixie' }}
            type=raw,value=latest,enable=${{ matrix.latest == true }}

      - name: Create and push tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ matrix.mysql }}-${{ matrix.variant }}
        run: |
          readarray -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]/#/--tag=}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG"
